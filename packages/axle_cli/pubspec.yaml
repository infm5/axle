name: axle_cli
description: Command-line tool for generating OpenAPI specs from annotated Dart servers.
version: 0.2.0
homepage: https://github.com/infm5/axle
repository: https://github.com/infm5/axle
issue_tracker: https://github.com/infm5/axle/issues
topics:
  - openapi
  - swagger
  - api-documentation
resolution: workspace

environment:
  sdk: ^3.11.0

executables:
  axle: axle

dependencies:
  analyzer: ^14.5.0
  args: ^2.7.0
  axle_core: ^0.2.0
  path: ^1.9.1
  yaml: ^3.1.2
dev_dependencies:
  json_annotation: ^4.9.0
  lints: ^6.0.0
  test: ^1.25.10
