# Structural validation of the golden specs. The fixtures are minimal on
# purpose, so documentation-completeness rules are off; schema and reference
# validity rules stay on.
extends:
  - recommended
rules:
  info-license: off
  info-license-strict: off
  no-empty-servers: off
  security-defined: off
  operation-4xx-response: off
  operation-summary: off
  tag-description: off
  no-unused-components: off
