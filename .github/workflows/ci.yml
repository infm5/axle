name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Run workspace checks
        run: dart run melos run check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build documentation
        working-directory: doc
        run: |
          npm ci
          npm run docs:build
      - name: Validate generated OpenAPI examples
        # Rule exceptions and their reasons live in redocly.yaml.
        run: |
          npx --yes @redocly/cli@2.71.0 lint \
            packages/axle_relic/example/openapi.json \
            packages/axle_shelf/example/openapi.json \
            examples/dart_mappable/openapi.json \
            examples/freezed_unions/openapi.json \
            examples/showcase/openapi.json \
            --config redocly.yaml
      - name: Validate golden OpenAPI specs
        run: |
          npx --yes @redocly/cli@2.71.0 lint \
            packages/axle_cli/test/golden/*.json \
            --config packages/axle_cli/test/golden/redocly.yaml
      - name: Generate coverage
        run: dart run melos run coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
