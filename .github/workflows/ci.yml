name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Run workspace checks
        run: dart run melos run check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build documentation
        working-directory: doc
        run: |
          npm ci
          npm run docs:build
      - name: Validate generated OpenAPI examples
        # security-defined is intentionally skipped: the examples mix public
        # and protected routes, and axle validates scheme references itself.
        run: |
          npx --yes @redocly/cli@2.71.0 lint \
            packages/axle_relic/example/openapi.json \
            --skip-rule=no-empty-servers \
            --skip-rule=security-defined \
            --skip-rule=info-license-strict \
            --skip-rule=info-license \
            --skip-rule=operation-4xx-response
          npx --yes @redocly/cli@2.71.0 lint \
            packages/axle_shelf/example/openapi.json \
            --skip-rule=no-empty-servers \
            --skip-rule=security-defined \
            --skip-rule=info-license-strict \
            --skip-rule=info-license \
            --skip-rule=operation-4xx-response
      - name: Generate coverage
        run: dart run melos run coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
