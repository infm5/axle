name: Publish axle_serverpod

on:
  push:
    tags:
      - 'axle_serverpod-v*'

permissions:
  contents: read

concurrency:
  group: publish-axle_serverpod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify axle_serverpod release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME must point to a commit on master."
            exit 1
          fi

      - name: Verify tag matches pubspec version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*//p' packages/axle_serverpod/pubspec.yaml | head -n 1 | tr -d '\"')"
          expected="axle_serverpod-v${version}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $expected."
            exit 1
          fi

      - name: Verify LICENSE
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f packages/axle_serverpod/LICENSE ]; then
            echo "::error::Add packages/axle_serverpod/LICENSE before publishing axle_serverpod."
            exit 1
          fi

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze package
        run: dart analyze
        working-directory: packages/axle_serverpod

      - name: Test package
        run: dart test
        working-directory: packages/axle_serverpod

  publish:
    name: Publish to pub.dev
    needs: verify
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/axle_serverpod
      use-flutter: false
      environment: pub.dev
