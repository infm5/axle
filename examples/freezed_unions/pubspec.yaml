name: freezed_unions_example
description: A Shelf API whose models use freezed unions, documented with axle.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.9.0

# axle_cli is not a dev dependency here: current freezed releases pin an older
# analyzer than axle_cli needs, so pub cannot solve both in one package. Install
# it once with `dart pub global activate axle_cli` and run `axle gen` instead.
dependencies:
  axle_shelf: ^0.3.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  shelf: ^1.4.3
  shelf_router: ^1.1.5

dev_dependencies:
  build_runner: ^2.4.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  lints: ^6.0.0
